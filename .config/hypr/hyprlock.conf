    halign = center
    valign = center
}



# Music blur div
shape {
    monitor =
    size = 340, 140
    color =rgba(00, 00, 00, 0.1)
    rounding = 30
    rotate = 0
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}



# Music album art
