image {
    monitor =
    path = ~/.config/wallpapers/icons/spidy_black_1.jpg
    border_color = 0xffdddddd
    border_size = 0
    size = 73
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
