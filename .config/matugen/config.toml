[config]

[config.wallpaper]
command = "awww"
arguments = ["img", "--transition-type", "wipe"]
set = true


[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = "kill -SIGUSR1 $(pidof kitty)"

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.btop]
input_path = './templates/btop-colors.conf'
output_path = '~/.config/btop/themes/matugen.conf'

# MacShell accent (Settings > Appearance > Accent "Wallpaper" swatch); MacBar watches this file, no restart
[templates.macshell]
input_path = './templates/macshell-accent'
output_path = '~/.config/macshell/accent'

[templates.spicetify]
input_path = './templates/spicetify-colors.conf'
output_path = '~/.config/spicetify/Themes/text/color.ini'
post_hook = 'spicetify config current_theme text color_scheme Matugen && spicetify apply || true'
